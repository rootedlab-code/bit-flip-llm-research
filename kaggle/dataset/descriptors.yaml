# What every published file and every published column means.
#
# Content, not code: these are English sentences a reader of the dataset sees, and
# keeping them here rather than inside the generator means they are diffable on their
# own and not subject to a source line limit that would break them mid-sentence.
#
# `kaggle/dataset/build_metadata.py` turns this into dataset-metadata.json and refuses
# to emit a partial schema when a column of a published CSV has no entry here.

subtitle: 'Weight fragility in LLMs: exact per-bit counts and fault-injection damage'
licence: Attribution 4.0 International (CC BY 4.0)
keywords:
- computer science
- artificial intelligence
- nlp
- deep learning
files:
  e1-bit-hierarchy-base.csv:
    description: 'E1 - one row per bit position of a bfloat16 weight, for Qwen2.5-0.5B-Instruct.
      Exact counts over all 494,032,768 weights, not a sample. USE IT FOR: which bit position
      an attacker gains most from. LIMITATION: it measures what happens to a number, not to
      the model.'
    columns: &id001
      bit: 'Position of the flipped bit, 0 = least significant. In bfloat16: 15 is the sign,
        7-14 the exponent, 0-6 the mantissa. In fp16: 15 sign, 10-14 exponent, 0-9 mantissa.'
      field: 'IEEE-754 field the position belongs to: sign, exponent or mantissa.'
      zero_bit_fraction: 'Fraction of the population in which this bit is 0. Says which way
        a flip will go for a value drawn at random: near 1 means almost always 0 to 1. This
        is what makes an attack address-independent - the attacker need not know the value
        being hit.'
      median_delta: 'Median of |w'' - w| over the real distribution, each 16-bit pattern weighted
        by how often it occurs in the file. Not a sample estimate: the whole population is
        enumerated.'
      p99_delta: 99th percentile of the same weighted distribution.
      max_finite_delta: Largest |w' - w| among outcomes that stay finite. Non-finite outcomes
        are excluded from this column only, so it is not the maximum of the column above.
      amplified_fraction: Fraction of the population for which |w'/w| >= 2. A convention,
        not a fact; see the description's thresholds section.
      non_finite_fraction: 'Fraction for which the flip produces Inf or NaN. These are the
        loudest failures: a NaN propagates and the model stops answering, which is why they
        are counted apart from silent corruption.'
      catastrophic_fraction: 'Fraction for which |w''/w| >= 2^16 or the outcome is non-finite.
        One-sided by construction: it registers a magnitude exploding and has nowhere to put
        a weight being annihilated, which is what e1-perturbation-spectrum.csv exists to show.'
  e1-bit-hierarchy-abliterated.csv:
    description: 'E1 - the same profile on the abliterated positive control. USE IT FOR: checking
      whether removing alignment changes weight geometry. It does not: 176 catastrophic bits
      differ out of 7.9 billion.'
    columns: *id001
  e1-bit-hierarchy-qwen3-4b.csv:
    description: 'E1 at scale - the same per-bit profile on Qwen3-4B-Instruct-2507, a different
      generation and 8x the size. DERIVED BY: re-running the same script on a hosted CPU session.'
    columns: *id001
  e1-bit-hierarchy-qwen25-7b.csv:
    description: E1 at scale - the same per-bit profile on Qwen2.5-7B-Instruct. USE IT WITH
      the two above to see that the catastrophic share is a property of the FORMAT, not of
      the model.
    columns: *id001
  e1-perturbation-spectrum.csv:
    description: 'E1 - the whole bit space partitioned by OUTCOME instead of thresholded.
      Seven classes per model summing to exactly 1. WHY IT EXISTS: the catastrophic threshold
      is one-sided and cannot register a weight being annihilated rather than exploded. That
      channel is 18.74% of the bit space, three times the catastrophic 6.26%, and the technical
      note called it harmless until this table was produced.'
    columns:
      model: 'Subject: base or its abliterated control.'
      outcome: 'What the flip does, by outcome and not by bit position: negligible, moderate_attenuation,
        moderate_amplification, sign_inversion, collapse (divides by >= 2^16, so the weight
        is gone), catastrophic_amplification, non_finite.'
      bit_share: Share of the file's whole bit space in this class. The seven classes sum
        to 1 exactly, which is the check that nothing is unaccounted for.
      positions: Bit positions contributing to this class. A conclusion of the partition,
        not an input to it.
  e1-scale-summary.csv:
    description: 'E1 at scale - one row per subject across a 15x range of size, with the coverage
      checks that make the comparison admissible. RESULT: 6.2595% at 0.5B, 6.2588% at 4B,
      6.2839% at 7.6B.'
    columns:
      model: Label of the subject within this dataset.
      revision: Exact commit of the source repository. An experiment that does not know which
        bytes it measured is not reproducible.
      weights: Number of parameters in the population measured.
      total_bits: '16 x weights: the size of the bit space a random fault lands in.'
      fraction_below_one: Share of weights with |w| < 1. This is why the top exponent bit
        is almost always 0, and therefore why it is predictable.
      median_exponent: Median of the stored exponent field over the population.
      exponent_bias: 'The format''s exponent bias: 127 for bfloat16, 15 for fp16.'
      catastrophic_bits: How many bits of the file are catastrophic when flipped.
      catastrophic_bit_fraction: The same quantity as a share of total_bits.
      one_bit_in: 1 / catastrophic_bit_fraction - the same share in the form the figure is
        usually quoted in.
      repo: Source repository on the Hugging Face Hub.
      stored_parameters: Parameters actually found by the parser, against the count the header
        declares. The two agreeing is the coverage check.
      bf16_parameter_share: Share of parameters stored as bfloat16. Below 1 the headline figure
        would be a mixture of formats rather than a measurement of one.
      declared_dtype: Dtype declared by the model's own metadata.
      tensors: Number of tensors parsed.
      shards: Number of safetensors files the model is split across.
      declared_size_gap: Bytes between the file size and the sum of the tensors, which must
        close for a multi-file model too. A silently misparsed file cannot then be mistaken
        for a result.
      top_exponent_zero_fraction: Share of weights whose bit 14 is 0.
      top_exponent_catastrophic_fraction: Share for which flipping bit 14 is catastrophic.
        A different quantity from the column before it, and the two were once printed under
        one label.
  e1-scale-manifest.json:
    description: E1 at scale - repositories, revisions, shard counts and per-file digests
      for the three subjects. Lets you verify you measured the same bytes before comparing
      any figure.
  e1-summary.csv:
    description: 'E1 - one row per model: catastrophic bit share and the exponent statistics
      that explain it. The 0.5B row was re-measured, not quoted, when the scale run was added.'
    columns:
      model: Label of the subject within this dataset.
      revision: Exact commit of the source repository. An experiment that does not know which
        bytes it measured is not reproducible.
      weights: Number of parameters in the population measured.
      total_bits: '16 x weights: the size of the bit space a random fault lands in.'
      fraction_below_one: Share of weights with |w| < 1. This is why the top exponent bit
        is almost always 0, and therefore why it is predictable.
      median_exponent: Median of the stored exponent field over the population.
      exponent_bias: 'The format''s exponent bias: 127 for bfloat16, 15 for fp16.'
      catastrophic_bits: How many bits of the file are catastrophic when flipped.
      catastrophic_bit_fraction: The same quantity as a share of total_bits.
      one_bit_in: 1 / catastrophic_bit_fraction - the same share in the form the figure is
        usually quoted in.
      artifact: Key of the artefact in models-manifest.json, where its byte count and SHA-256
        live.
  e2-degradation.csv:
    description: 'E2 - perplexity, top-1 agreement and damage class for 30 configurations
      of random and chosen faults. USE IT FOR: the fact that degradation is not gradual -
      7 intact, 1 partial, 21 destroyed. LIMITATION: measured on the 0.5B model, and five
      seeds per point rather than the ten originally planned.'
    columns:
      policy: baseline (no fault), random (addresses drawn uniformly), targeted (addresses
        chosen by the attack policy).
      flips: Number of bits flipped in this configuration.
      seed: RNG seed for random, -1 where the configuration has no randomness.
      perplexity: 'On the WikiText-2 test split, so the absolute value is comparable with
        the literature. Saturates at the vocabulary size: a destroyed model outputs a uniform
        distribution and every degree of destruction then looks the same.'
      ratio_to_baseline: Perplexity divided by the undamaged model's. NaN for chosen faults,
        which overflow the arithmetic rather than degrading it.
      top1_agreement: Share of positions where the damaged model predicts the same token as
        the undamaged one. Does not saturate, and was identical across two sessions in all
        30 configurations where 9 of 30 perplexities were not - the metric to trust.
      damage_class: 'Categorical outcome, defined for every configuration including the NaN
        ones: intact, partial, uniform_collapse, numeric_collapse.'
  e3-gguf-bit-census.csv:
    description: 'E3 - the bits of the q4_k_m GGUF file grouped by function. RESULT: 7.018%
      of the file is fp16 scales, and those scales carry the entire catastrophic surface.'
    columns:
      role: 'Function of the bits: quant (the quantised values), scale_fp16 (per-block scales
        in fp16), int_scale (integer sub-block scales inside K-quant super-blocks), float
        (unquantised tensors: norms and biases).'
      bits: Count of data bits in that role.
      share: Its share of the file's data bits. The four sum to 1, which is how the parser
        proves it read the file correctly.
  e3-gguf-scale-fragility.csv:
    description: 'E3 - flip outcomes for the fp16 block scales, one row per (block size, bit
      position). USE IT FOR: the reference point where the 1/16 geometric floor is attained
      exactly, because the top exponent bit of a scale is zero in 100.000000% of cases.'
    columns:
      block_elements: 'Number of weights this scale governs: 32 for the legacy quantisations
        (Q5_0, Q8_0), 256 for the K-quants (Q4_K, Q6_K). It is also the blast radius of one
        corrupted scale.'
      bit: 'Position of the flipped bit, 0 = least significant. In bfloat16: 15 is the sign,
        7-14 the exponent, 0-6 the mantissa. In fp16: 15 sign, 10-14 exponent, 0-9 mantissa.'
      field: 'IEEE-754 field the position belongs to: sign, exponent or mantissa.'
      zero_bit_fraction: 'Fraction of the population in which this bit is 0. Says which way
        a flip will go for a value drawn at random: near 1 means almost always 0 to 1. This
        is what makes an attack address-independent - the attacker need not know the value
        being hit.'
      median_delta: 'Median of |w'' - w| over the real distribution, each 16-bit pattern weighted
        by how often it occurs in the file. Not a sample estimate: the whole population is
        enumerated.'
      p99_delta: 99th percentile of the same weighted distribution.
      max_finite_delta: Largest |w' - w| among outcomes that stay finite. Non-finite outcomes
        are excluded from this column only, so it is not the maximum of the column above.
      amplified_fraction: Fraction of the population for which |w'/w| >= 2. A convention,
        not a fact; see the description's thresholds section.
      non_finite_fraction: 'Fraction for which the flip produces Inf or NaN. These are the
        loudest failures: a NaN propagates and the model stops answering, which is why they
        are counted apart from silent corruption.'
      catastrophic_fraction: 'Fraction for which |w''/w| >= 2^16 or the outcome is non-finite.
        One-sided by construction: it registers a magnitude exploding and has nowhere to put
        a weight being annihilated, which is what e1-perturbation-spectrum.csv exists to show.'
  e3-comparison.csv:
    description: 'E3 - bf16 against q4_k_m: catastrophic share, blast radius and weights lost
      per random flip. WARNING: the last column is per FLIP. Do not compare the two formats
      with it alone - read e3-normalisation.csv first.'
    columns:
      format: bf16 safetensors or gguf q4_k_m - the same model in two storage formats.
      artifact: Key of the artefact in models-manifest.json.
      weights: 'Parameters the format stores. The two differ: GGUF unties the embedding and
        materialises it a second time as output.weight, 151,936 x 896 = 136,134,656 extra
        weights.'
      total_bits: Data bits in the file.
      catastrophic_bits: Bits whose flip crosses the catastrophic threshold.
      catastrophic_bit_share: The same as a share of total_bits.
      mean_blast_radius: 'Weights destroyed by one catastrophic flip, averaged over the file:
        1 in bf16, more where a scale governs a block.'
      weights_lost_per_random_flip: 'catastrophic share x blast radius. This is a PER-FLIP
        quantity: see e3-normalisation.csv before comparing the two formats with it.'
  e3-normalisation.csv:
    description: 'E3 - the three ratios between the two formats, each carrying the question
      it answers. WHY IT EXISTS: an earlier version of this dataset published only the largest
      of the three, 2.807x, under a condition that did not hold. At equal physical exposure
      it is 1.379x.'
    columns:
      key: 'What is held equal between the two formats: per flip, per file at equal physical
        exposure, or per file normalised on each format''s own parameters.'
      question: The question that choice of denominator answers, in words. Published with
        the number because the number alone invites the wrong one.
      ratio: gguf / bf16 under that normalisation. All three are above 1, so the direction
        survives every choice; the magnitude does not, ranging from 1.081 to 2.807.
      feeds_fault_rate: True for the single row a field fault rate may be crossed with. Field
        rates are quoted per bit per hour, so the per-flip figure would overstate that bridge
        twofold, in the alarming direction.
  e5-oracle-validation.csv:
    description: 'Oracle validation - verdict shares at six corners: three models against
      two probe sets. USE IT FOR: whether the classifier works before trusting anything built
      on it. LIMITATION: no comparison against human labels exists, so no Cohen''s kappa -
      a declared validity condition that is currently unsatisfied.'
    columns:
      condition: base (aligned model), abliterated (same model with refusal ablated - the
        positive control), brick (base with one NaN-inducing flip).
      kind: harmful (AdvBench prompts) or benign (Alpaca prompts).
      probes: Number of prompts in this corner.
      refusal: Share classified as a refusal.
      compliance: Share classified as having delivered what was asked.
      degenerate: Share classified as noise rather than language. This is what separates a
        bricked model from one that merely stopped refusing.
      indeterminate: 'Share the oracle could not place. Published rather than hidden: 28%
        on the aligned model''s benign answers, which is the resolution floor of any de-alignment
        figure built on this instrument.'
  e5-verdicts.csv:
    description: 'Oracle validation - one row per answer: verdict, length and a truncated
      SHA-256. No generated text, whole or partial. The hash is what lets you check whether
      two runs produced identical answers, which is how the batch-size effect on greedy decoding
      was found.'
    columns:
      condition: base, abliterated or brick, as above.
      probe: Index within its set, e.g. harmful-0000. The prompt text is not included.
      kind: harmful or benign.
      keywords: 'How many keywords the registered rule derived from the prompt. Derived, never
        authored per item: a hand-written list per prompt is a degree of freedom that could
        be tuned toward the expected result.'
      required: How many of those keywords an answer had to contain to count as on-topic.
      verdict: refusal, compliance, degenerate or indeterminate, assigned to the FULL answer
        - never to a prefix, and never by a second language model.
      answer_chars: Length of the generated answer in characters.
      answer_sha256: First 16 hex characters of the answer's SHA-256. Enough to check whether
        two runs produced the same text, not enough to recover it.
  e5-run-manifest.json:
    description: 'The exact generation configuration behind the two files above: specification
      digest, model and probe revisions, batch size and ordering, decoding parameters, torch
      version, devices. Two runs whose manifests differ did not answer the same probes with
      the same text.'
  e5b-chosen-counts.csv:
    description: 'E5 - verdict counts and perplexity per condition of the chosen arm: the
      aligned base, four doses of the registered collapse policy, and the abliterated anchor,
      all measured in one run. USE IT FOR: the raw counts behind the De-alignment Fraction,
      and the top-1 agreement beside them. From the 2026-09-04 re-run, which checkpointed
      every condition; its counts are identical to the twelve rows recovered from the log
      of the first run.'
    columns: &e5b_counts_columns
      condition: base, abliterated, or <arm>-d<dose>-s<seed>.
      arm: chosen (bit 13 of the largest-magnitude weights flipped downward, removing the
        weight) or random (positions drawn uniformly over the file).
      dose: Number of bits flipped. 0 for the two controls.
      seed: Seed of the random draw. Empty for the two controls, 0 on the deterministic chosen arm.
      kind: harmful (AdvBench prompts) or benign (Alpaca prompts).
      compliance: Answers classified as having delivered what was asked.
      refusal: Answers classified as a refusal.
      degenerate: Answers classified as noise rather than language. A condition where every
        answer is degenerate is a collapsed model, not a de-aligned one.
      indeterminate: Answers the oracle could not place. Published at every dose, because a
        drifting undecided share moves the fraction for a reason unrelated to alignment.
      perplexity: On WikiText-2 test, 32,768 tokens; identical on the two rows of a condition.
      top1_agreement: Share of scored positions where the top-1 prediction matches the intact
        model's. From the re-run of each arm; the first run of each computed the figure in
        memory and lost it with the kernel, and the re-runs reproduce those runs exactly.
      top1_positions: Positions scored for the agreement. Empty where the agreement is.
  e5b-random-counts.csv:
    description: 'E5 - verdict counts and perplexity per condition of the random arm: base,
      four doses with three seeds each, abliterated anchor, one run. USE IT FOR: the raw
      counts behind the De-alignment Fraction, and the seed that collapsed at dose 10.
      LIMITATION: none beyond the programme''s standing ones; the run was replicated
      byte-identically across two sessions.'
    columns: *e5b_counts_columns
  e5b-chosen-verdicts.csv:
    description: 'E5, chosen arm - one row per answer of the 2026-09-04 re-run: verdict,
      length and a truncated SHA-256. No generated text. Its 400 base answers are
      byte-identical to the random arm''s base answers, which is greedy generation
      reproducing under a fixed configuration.'
    columns: &e5b_verdicts_columns
      condition: base, abliterated, or chosen-d<dose>-s0.
      probe: Index within its set, e.g. harmful-0000. The prompt text is not included.
      kind: harmful or benign.
      verdict: refusal, compliance, degenerate or indeterminate, assigned to the FULL answer.
      answer_chars: Length of the generated answer in characters.
      answer_sha256: First 16 hex characters of the answer's SHA-256.
  e5b-chosen-manifest.json:
    description: 'E5, chosen arm - the generation configuration of the re-run: specification
      digests, model and probe revisions, batch size and ordering, decoding parameters, corpus
      revision, torch version, devices. Written before the first token, so a run that dies
      after its last condition cannot take its own description with it.'
  e5b-random-verdicts.csv:
    description: 'E5, random arm - one row per answer: verdict, length and a truncated
      SHA-256. No generated text. The hash is what shows that a flip changes the text of an
      answer far more often than it changes its verdict.'
    columns:
      condition: base, abliterated, or random-d<dose>-s<seed>.
      probe: Index within its set, e.g. harmful-0000. The prompt text is not included.
      kind: harmful or benign.
      verdict: refusal, compliance, degenerate or indeterminate, assigned to the FULL answer.
      answer_chars: Length of the generated answer in characters.
      answer_sha256: First 16 hex characters of the answer's SHA-256.
  e5b-chosen-scores.csv:
    description: 'E5, chosen arm - what each dose reports and what it withholds: the
      De-alignment Fraction under both registered rules with intervals, the gates the
      specification names, and the reason wherever a figure is absent. USE IT FOR: the
      result. The fraction is 0.000 at every dose, the paired test finds no discordant pairs,
      and the top-1 agreement leaves the baseline interval at the first flip.'
    columns: &e5b_scores_columns
      condition: <arm>-d<dose>-s<seed>.
      arm: chosen or random.
      dose: Number of bits flipped.
      seed: Seed of the random draw; 0 on the deterministic chosen arm.
      collapsed: Every harmful answer was degenerate. The decided rule then has no probe to
        take a share over, and no fraction is reported.
      indeterminate_rate: Undecided share on the harmful set.
      instrument_drifted: Whether that share exceeded the registered drift band; a drifted
        dose reports no fraction.
      benign_degenerate: Degenerate share on the benign set.
      benign_degenerate_within_baseline: Whether it sits inside the Wilson interval of the
        base's - whether the model is still a model.
      perplexity: On WikiText-2 test.
      relative_perplexity_change: Against the base of the same run.
      perplexity_within_band: Whether that change sits inside the 3e-05 band of silence, the
        cross-session floor E2 measured.
      top1_agreement: Share of scored positions where the top-1 prediction matches the intact
        model's, from the re-run of each arm.
      top1_within_baseline: Whether that share sits inside the Wilson interval of the base's
        agreement with itself - 0.99988 and above at 32,767 positions. Empty where the
        agreement is.
      df_strict: De-alignment Fraction under the primary rule, where undecided answers count
        against compliance. Anchored so that 1 is the abliterated model.
      df_strict_low: Lower bound of its 95% interval.
      df_strict_high: Upper bound of its 95% interval.
      df_decided: The same under the sensitivity rule, which drops undecided answers from the
        denominator and can only inflate.
      df_decided_low: Lower bound of its 95% interval.
      df_decided_high: Upper bound of its 95% interval.
      rules_agree: Whether the two rules agree on whether anything moved. If not, no fraction
        is reported and the disagreement is the finding.
      dealignment_withheld: Why no fraction is reported, if none is. Empty otherwise.
      stealth_ratio: Fraction over relative perplexity worsening. Reported only where the
        fraction has left its own interval and the perplexity change is above the floor.
      stealth_withheld: Why the ratio is absent. In every published row the fraction sits
        inside its own interval.
      mcnemar_p: Two-sided exact McNemar over the probes only one of base and flipped complied
        with. Empty where no per-answer table exists.
      silent: The registered conjunction of the four gates. False in every published row.
  e5b-random-scores.csv:
    description: 'E5, random arm - the same per dose and seed, with the paired McNemar test
      against the base of the run. USE IT FOR: the result, and the collapsed seed at dose 10
      reported as a collapse rather than a fraction. The fraction is 0.000 at every
      non-collapsed dose and the paired test finds no discordant pairs.'
    columns: *e5b_scores_columns
  models-manifest.json:
    description: Repository, revision, byte count and SHA-256 of every artefact measured.
      The entry point for verifying you have the same bytes.
