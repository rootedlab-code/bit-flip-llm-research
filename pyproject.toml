[project]
name = "bitflip"
version = "0.1.0"
description = "Ricerca sperimentale sui bit-flip nei pesi dei modelli linguistici"
# 3.11 is the floor: hashlib.file_digest arrived there, and Kaggle images
# still ship 3.12.
requires-python = ">=3.11"
dependencies = [
    # Deliberately low floors: nothing here needs a recent numpy, and a high floor
    # forces an upgrade on hosted images whose other packages are compiled against
    # the numpy they ship -- which breaks them.
    "numpy>=1.24",
    "safetensors>=0.3",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.26"]
inference = ["torch>=2.5", "transformers>=4.45"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

# La GPU di questa macchina (RTX 4060, driver CUDA 12.4) non puo eseguire le build
# cu13x pubblicate su PyPI, e le librerie CUDA che si porterebbero dietro sono ~5 GB
# di peso morto. La CPU e inoltre deterministica senza accorgimenti, come richiede il
# Principio III. Se in futuro servisse la GPU, la strada e una build cu126.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitflip"]
# The pre-registered oracle criteria must travel with the code: a specification that
# only exists in the source tree is not registered anywhere the experiments run.
artifacts = ["src/bitflip/spec/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET"]
