[project]
name = "bitflip"
version = "0.1.0"
description = "Ricerca sperimentale sui bit-flip nei pesi dei modelli linguistici"
# 3.11 is the floor: hashlib.file_digest arrived there, and Kaggle images
# still ship 3.12.
requires-python = ">=3.11"
dependencies = [
    # Deliberately low floors: nothing here needs a recent numpy, and a high floor
    # forces an upgrade on hosted images whose other packages are compiled against
    # the numpy they ship -- which breaks them.
    "numpy>=1.24",
    "safetensors>=0.3",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.26"]
inference = ["torch>=2.5", "transformers>=4.45"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0.12.20260815",
]

# La GPU di questa macchina (RTX 4060, driver CUDA 12.4) non puo eseguire le build
# cu13x pubblicate su PyPI, e le librerie CUDA che si porterebbero dietro sono ~5 GB
# di peso morto. La CPU e inoltre deterministica senza accorgimenti, come richiede il
# Principio III. Se in futuro servisse la GPU, la strada e una build cu126.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitflip"]
# The pre-registered oracle criteria must travel with the code: a specification that
# only exists in the source tree is not registered anywhere the experiments run.
artifacts = ["src/bitflip/spec/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Il pacchetto e controllato al livello di `--strict`, espanso opzione per opzione qui
# sotto perche `strict` non e impostabile per modulo; test ed esperimenti restano al
# livello base, dove una fixture senza annotazioni non e un difetto.
[tool.mypy]
files = ["src/bitflip", "experiments", "tests"]
# 3.12 e la versione che gira su Kaggle, dove le corse pubbliche avvengono. Non e il
# floor dichiarato (3.11) perche gli stub di numpy usano sintassi 3.12+ e mypy si
# ferma prima di controllare qualunque cosa.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "bitflip.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET"]
